<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="apple.css?v=3">
<style>
  html, body { background: #fff; width: 390px; height: 844px; overflow: hidden; position: relative; }
  .status { height: 50px; display: flex; justify-content: space-between; align-items: center; padding: 6px 30px 0 34px; font: 600 16px sans-serif; }
  .top { display: flex; align-items: center; height: 56px; padding: 0 16px; position: relative; border-bottom: 1px solid #eee; }
  .back { width: 44px; height: 44px; border-radius: 50%; border: 1px solid #ddd; display: grid; place-items: center; font-size: 22px; color: #333; }
  .top h1 { position: absolute; left: 0; right: 0; text-align: center; font: 700 18px/1 "Be Vietnam Pro", sans-serif; pointer-events: none; }
  .shelf { padding: 14px 0 34px; }
  .shelf.grey { background: #f5f5f6; }
  .shelf h2 { font: 800 22px/1 "Be Vietnam Pro", sans-serif; padding: 12px 20px 0; }
  .shelf h2 span { color: #b0b0b5; font-weight: 600; }
  .row { display: flex; gap: 16px; padding: 26px 20px 4px; overflow: hidden; align-items: flex-end; }
  .row .poster { width: 160px; flex: none; font-size: 15px; }
  .row .poster.tall { width: 160px; }
  .cap { display: flex; gap: 16px; padding: 12px 20px 0; }
  .cap div { width: 160px; flex: none; font-size: 12px; color: #6e6e73; }
  .cap b { display: block; color: #1d1d1f; font-size: 13px; font-weight: 600; }
  .tabbar { position: fixed; left: 12px; width: 366px; bottom: 22px; height: 68px; border-radius: 34px; background: rgba(250,250,250,.96);
    box-shadow: 0 6px 24px rgba(0,0,0,.14), 0 0 0 1px rgba(0,0,0,.05); display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; padding: 0 6px; }
  .tabbar a { display: grid; justify-items: center; gap: 3px; font-size: 11px; font-weight: 500; color: #1d1d1f; padding: 8px 0; border-radius: 28px; }
  .tabbar a.on { background: #ececee; }
  .tabbar svg { width: 24px; height: 24px; }
</style></head>
<body>
<div class="status"><span>10:42</span><span>▂▄▆ ◔ ▮</span></div>
<div class="top"><span class="back">‹</span><h1>Văn học Việt Nam</h1></div>

<section class="shelf grey">
  <h2>Truyện ngắn <span>›</span></h2>
  <div class="row">
    <div class="poster"><div data-concept="chipheo"></div></div>
    <div class="poster"><div data-concept="gio"></div></div>
    <div class="poster"><div data-concept="tatden"></div></div>
  </div>
  <div class="cap"><div><b>Chí Phèo</b>7 bản · từ 45.000 ₫</div><div><b>Gió đầu mùa</b>3 bản · từ 60.000 ₫</div></div>
</section>

<section class="shelf">
  <h2>Đấu giá sách xưa <span>›</span></h2>
  <div class="row">
    <div class="poster"><img src="../assets/cover-of-trung-tiet-anh-hung-lich.jpg" alt=""></div>
    <div class="poster"><img src="../assets/tran-danh-cua-ai-da-nang.jpg" alt=""></div>
    <div class="poster"><img src="../assets/nam-phong-tap-chi-bui-quang-tuan.jpg" alt=""></div>
  </div>
  <div class="cap"><div><b>Trung tiết anh hùng</b><span style="color:#b3261e">1.850.000 ₫ · còn 42:10</span></div><div><b>Ngô Tất Tố, in 1935</b>1.200.000 ₫ · còn 5:05:00</div></div>
</section>

<nav class="tabbar">
  <a class="on"><svg viewBox="0 0 24 24" fill="#1d1d1f"><path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z"/></svg>Trang chủ</a>
  <a><svg viewBox="0 0 24 24" fill="#1d1d1f"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16 5l3.5-1 3 15.5-3.5 1z"/></svg>Thư viện</a>
  <a><svg viewBox="0 0 24 24" fill="#1d1d1f"><path d="M5 8h14l-1 13H6z"/><path d="M9 8a3 3 0 0 1 6 0" stroke="#1d1d1f" stroke-width="2" fill="none"/></svg>Chợ sách</a>
  <a><svg viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Tìm kiếm</a>
</nav>
<script src="covers.js"></script>
</body></html>
