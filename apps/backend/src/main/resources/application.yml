server:
  port: ${PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: rebook-backend
  config:
    # Cấu hình riêng của từng máy (khoá ZaloPay riêng, APP_URL...) đặt ở apps/backend/.env, dạng KEY=giá trị; file này không commit.
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rebook_dev}
    username: ${DB_USERNAME:rebook}
    password: ${DB_PASSWORD:rebook}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Gom truy vấn lazy (ảnh sách, item đơn) để tránh N+1
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Ho_Chi_Minh

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  storage:
    # Thư mục lưu ảnh tải lên (biên lai chuyển khoản...)
    dir: ${STORAGE_DIR:uploads}
  jwt:
    # Đổi bằng biến môi trường JWT_SECRET (>= 32 ký tự) khi deploy.
    secret: ${JWT_SECRET:rebook-dev-secret-change-me-please-0123456789abcdef}
    access-token-minutes: 60
    refresh-token-days: 30
  otp:
    ttl-minutes: 10
    # true = trả OTP trong response (chỉ dùng khi dev, vì chưa có dịch vụ gửi mail/SMS)
    expose-in-response: false
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  auction:
    engine-enabled: true
  payment:
    # true = cho phép gọi /payments/{code}/simulate để giả lập cổng thanh toán trả về thành công
    simulate-enabled: false
    zalopay:
      # Mặc định là bộ khoá sandbox dùng thử công khai trong tài liệu ZaloPay (app 2554, không cần đăng ký).
      # Có tài khoản sandbox riêng thì đặt ZALOPAY_APP_ID / ZALOPAY_KEY1 / ZALOPAY_KEY2 trong .env. Để trống app-id = tắt ZaloPay (giả lập).
      app-id: ${ZALOPAY_APP_ID:2554}
      key1: ${ZALOPAY_KEY1:sdngKKJmqEMzvh5QQcdD2A9XBSKUNaYn}
      key2: ${ZALOPAY_KEY2:trMrHtvjo6myautxDUiAcYsVtaeQ8nhf}
      endpoint: ${ZALOPAY_ENDPOINT:https://sb-openapi.zalopay.vn/v2}
      return-url: ${ZALOPAY_RETURN_URL:http://localhost:8080/payments/zalopay/return}
      callback-url: ${ZALOPAY_CALLBACK_URL:}
    # Bản web của app (chạy `flutter run -d chrome --web-port 5199 ...`). Trống = trang kết quả chỉ nhắc quay lại app.
    app-url: ${APP_URL:http://localhost:5199}

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    # Thêm dữ liệu mẫu khi chạy profile dev
    locations: classpath:db/migration,classpath:db/seed
app:
  otp:
    expose-in-response: true
  payment:
    simulate-enabled: true

logging:
  level:
    com.rebook: DEBUG
