# Test chạy trên cùng PostgreSQL nhưng trong schema riêng rebook_test để không đụng dữ liệu dev.
spring:
  datasource:
    # ",public": extension unaccent (tìm kiếm không dấu) nằm ở schema public, xem V23.
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/rebook_dev?currentSchema=rebook_test,public}
  flyway:
    schemas: rebook_test
    default-schema: rebook_test
    create-schemas: true
    locations: classpath:db/migration

app:
  auction:
    engine-enabled: false
    demo-enabled: true
  storage:
    dir: target/test-uploads
  payment:
    simulate-enabled: true
    # Test không gọi ZaloPay thật (để trống app-id = tắt ZaloPay, dùng cổng giả lập); ZaloPayTest bật lại với client giả.
    zalopay:
      app-id: ""
  shipping:
    simulate-enabled: true
