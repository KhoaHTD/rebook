name: book_marketplace
description: "Chợ sách cũ & đấu giá — Flutter web + mobile."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  cached_network_image: ^4.0.4
  dio: ^5.11.1
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^3.1.0
  go_router: ^18.1.1
  image_picker: ^1.2.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  latlong2: ^0.10.1
  retrofit: ^4.10.0
  riverpod_annotation: ^4.0.7
  stomp_dart_client: ^3.0.1
  url_launcher: ^6.3.3
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  riverpod_generator: ^4.0.9
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  retrofit_generator: ^10.3.2
  swagger_parser: ^1.45.0
  mocktail: ^1.0.5
  yaml: ^3.1.4
flutter:
  uses-material-design: true
  generate: true
  assets:
    # Bìa sách mẫu (chế độ mock) — xem lib/shared/data/fake/fake_catalog.dart.
    - assets/books/
    # Tranh banner trang chủ (người dùng vẽ) — xem docs/BANNERS.md.
    - assets/banners/
  # Không đóng gói font riêng: chữ dùng font hệ thống (xem AppFonts trong app_tokens.dart).
