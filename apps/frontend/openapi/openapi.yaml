components:
  schemas:
    ShelfRequest:
      type: object
      properties:
        shelfCode:
          type: string
          maxLength: 30
          minLength: 0
      required:
      - shelfCode
    WarehouseResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        consignmentId:
          type: integer
          format: int64
        bookTitle:
          type: string
        shelfCode:
          type: string
        status:
          $ref: "#/components/schemas/WarehouseStatus"
        checkedInAt:
          type: string
          format: date-time
        checkedOutAt:
          type: string
          format: date-time
        checkoutReason:
          type: string
        returnNotifiedAt:
          type: string
          format: date-time
        storageFee:
          type: number
    WarehouseStatus:
      type: string
      enum:
      - IN_STOCK
      - RESERVED
      - SHIPPED
      - RETURNED
    BookRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 300
          minLength: 0
        author:
          type: string
          maxLength: 200
          minLength: 0
        publisher:
          type: string
          maxLength: 200
          minLength: 0
        publishYear:
          type: integer
          format: int32
          maximum: 2100
          minimum: 1500
        isbn:
          type: string
          maxLength: 20
          minLength: 0
        language:
          type: string
          maxLength: 50
          minLength: 0
        pages:
          type: integer
          format: int32
          minimum: 1
        categoryId:
          type: integer
          format: int64
        conditionGrade:
          $ref: "#/components/schemas/ConditionGrade"
        description:
          type: string
          maxLength: 5000
          minLength: 0
        weightGram:
          type: integer
          format: int32
          minimum: 1
        imageUrls:
          type: array
          items:
            type: string
            minLength: 1
          maxItems: 10
          minItems: 3
      required:
      - author
      - categoryId
      - conditionGrade
      - imageUrls
      - title
      - weightGram
    ConditionGrade:
      type: string
      enum:
      - NEW
      - LIKE_NEW
      - VERY_GOOD
      - GOOD
      - ACCEPTABLE
    ListingRequest:
      type: object
      properties:
        book:
          $ref: "#/components/schemas/BookRequest"
        price:
          type: number
          minimum: 1000
        stock:
          type: integer
          format: int32
          minimum: 0
      required:
      - book
      - price
      - stock
    BookResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        author:
          type: string
        publisher:
          type: string
        publishYear:
          type: integer
          format: int32
        isbn:
          type: string
        language:
          type: string
        pages:
          type: integer
          format: int32
        categoryId:
          type: integer
          format: int64
        conditionGrade:
          $ref: "#/components/schemas/ConditionGrade"
        description:
          type: string
        weightGram:
          type: integer
          format: int32
        coverUrl:
          type: string
        images:
          type: array
          items:
            $ref: "#/components/schemas/ImageResponse"
    ImageResponse:
      type: object
      properties:
        url:
          type: string
        source:
          $ref: "#/components/schemas/ImageSource"
    ImageSource:
      type: string
      enum:
      - SELLER
      - STAFF
    ListingDetail:
      type: object
      properties:
        id:
          type: integer
          format: int64
        price:
          type: number
        stock:
          type: integer
          format: int32
        soldCount:
          type: integer
          format: int32
        status:
          $ref: "#/components/schemas/ListingStatus"
        rejectReason:
          type: string
        book:
          $ref: "#/components/schemas/BookResponse"
        shop:
          $ref: "#/components/schemas/ShopBrief"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ListingStatus:
      type: string
      enum:
      - PENDING_REVIEW
      - ACTIVE
      - OUT_OF_STOCK
      - HIDDEN
      - REJECTED
    ShopBrief:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        pickupProvince:
          type: string
        ratingAvg:
          type: number
        ratingCount:
          type: integer
          format: int32
    StockRequest:
      type: object
      properties:
        stock:
          type: integer
          format: int32
          minimum: 0
      required:
      - stock
    UpdateProfileRequest:
      type: object
      properties:
        fullName:
          type: string
          maxLength: 120
          minLength: 0
        phone:
          type: string
          pattern: "^0\\d{9,10}$"
        avatarUrl:
          type: string
          maxLength: 500
          minLength: 0
      required:
      - fullName
    Role:
      type: string
      enum:
      - USER
      - STAFF
      - ADMIN
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        phone:
          type: string
        fullName:
          type: string
        avatarUrl:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/UserStatus"
        emailVerified:
          type: boolean
        phoneVerified:
          type: boolean
        auctionBannedUntil:
          type: string
          format: date-time
        shopId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    UserStatus:
      type: string
      enum:
      - ACTIVE
      - LOCKED
    ShopRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 0
        description:
          type: string
          maxLength: 2000
          minLength: 0
        pickupAddress:
          type: string
          maxLength: 500
          minLength: 0
        pickupProvince:
          type: string
          minLength: 1
        bankName:
          type: string
          minLength: 1
        bankAccountNumber:
          type: string
          maxLength: 50
          minLength: 0
        bankAccountHolder:
          type: string
          maxLength: 120
          minLength: 0
      required:
      - bankAccountHolder
      - bankAccountNumber
      - bankName
      - name
      - pickupAddress
      - pickupProvince
    ShopResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        ownerId:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        pickupProvince:
          type: string
        pickupAddress:
          type: string
        ratingAvg:
          type: number
        ratingCount:
          type: integer
          format: int32
        trusted:
          type: boolean
        bankName:
          type: string
        bankAccountNumber:
          type: string
        bankAccountHolder:
          type: string
        createdAt:
          type: string
          format: date-time
    AddressRequest:
