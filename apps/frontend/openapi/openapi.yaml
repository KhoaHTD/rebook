    LotDto:
      type: object
      required: [id, sessionId, lotNumber, book, estimateLow, estimateHigh, startPrice, currentPrice, bidCount, status, watched]
      properties:
        id: { type: string }
        sessionId: { type: string }
        lotNumber: { type: integer }
        book: { $ref: '#/components/schemas/BookDto' }
        story: { type: string }
        conditionReport: { type: string }
        signature: { $ref: '#/components/schemas/SignatureStatus' }
        estimateLow: { type: integer, format: int64 }
        estimateHigh: { type: integer, format: int64 }
        startPrice: { type: integer, format: int64 }
        currentPrice: { type: integer, format: int64 }
        bidCount: { type: integer }
        status: { $ref: '#/components/schemas/LotStatus' }
        outcome: { $ref: '#/components/schemas/LotOutcome' }
        endsAt: { type: string, format: date-time }
        hammerPrice: { type: integer, format: int64 }
        leadingPaddle: { type: string }
        watched: { type: boolean }
    SessionCatalogueDto:
      type: object
      required: [session, lots]
      properties:
        session: { $ref: '#/components/schemas/AuctionSessionDto' }
        lots: { type: array, items: { $ref: '#/components/schemas/LotDto' } }
    RegisterSessionRequest:
      type: object
      required: [agreeRules, depositAmount]
      properties:
        agreeRules: { type: boolean }
        depositAmount: { type: integer, format: int64, description: Tối thiểu = depositAmount của phiên; cọc thêm để tăng hạn mức }
    RegistrationDto:
      type: object
      required: [id, sessionId, sessionTitle, paddleNumber, depositAmount, bidLimit, committedAmount, status]
      properties:
        id: { type: string }
        sessionId: { type: string }
        sessionTitle: { type: string }
        paddleNumber: { type: string, description: "vd #027" }
        depositAmount: { type: integer, format: int64 }
        bidLimit: { type: integer, format: int64, description: Cọc × hệ số (mặc định 10) }
        committedAmount: { type: integer, format: int64, description: Tổng giá đang giữ / đã thắng trong phiên }
        status: { $ref: '#/components/schemas/RegistrationStatus' }
    BidDto:
      type: object
      required: [id, lotId, paddleNumber, amount, createdAt, isAuto]
      properties:
        id: { type: string }
        lotId: { type: string }
        paddleNumber: { type: string }
        amount: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        isAuto: { type: boolean }
    PlaceBidRequest:
      type: object
      required: [amount]
      properties: { amount: { type: integer, format: int64 } }
    ProxyBidRequest:
      type: object
      required: [maxAmount]
      properties: { maxAmount: { type: integer, format: int64 } }
    ProxyBidDto:
      type: object
      required: [lotId, maxAmount, active]
      properties:
        lotId: { type: string }
        maxAmount: { type: integer, format: int64 }
        active: { type: boolean }
    WatchRequest: { type: object, required: [watch], properties: { watch: { type: boolean } } }
    SessionStateDto:
      type: object
      required: [session, serverTime, recentBids, lots]
      properties:
        session: { $ref: '#/components/schemas/AuctionSessionDto' }
        currentLot: { $ref: '#/components/schemas/LotDto' }
        lots: { type: array, items: { $ref: '#/components/schemas/LotDto' } }
        serverTime: { type: string, format: date-time }
        myRegistration: { $ref: '#/components/schemas/RegistrationDto' }
        recentBids: { type: array, items: { $ref: '#/components/schemas/BidDto' } }
        viewerCount: { type: integer }
    LotResultDto:
      type: object
      required: [lotId, lotNumber, title, outcome]
      properties:
        lotId: { type: string }
        lotNumber: { type: integer }
        title: { type: string }
        outcome: { $ref: '#/components/schemas/LotOutcome' }
        hammerPrice: { type: integer, format: int64 }
        winnerPaddle: { type: string }
        wonByMe: { type: boolean }
    SessionResultDto:
      type: object
      required: [session, results]
      properties:
        session: { $ref: '#/components/schemas/AuctionSessionDto' }
        results: { type: array, items: { $ref: '#/components/schemas/LotResultDto' } }
    AuctionEventDto:
      type: object
      description: "Tin nhắn STOMP trên /topic/sessions/{sessionId}. Lỗi riêng từng người ở /user/queue/errors (ErrorResponse)."
      required: [type, sessionId, serverTime]
      properties:
        type: { type: string, enum: [LOT_OPENED, BID_PLACED, LOT_CLOSED, SESSION_PAUSED, SESSION_RESUMED, SESSION_ENDED] }
        sessionId: { type: string }
        serverTime: { type: string, format: date-time }
        lot: { $ref: '#/components/schemas/LotDto' }
        bid: { $ref: '#/components/schemas/BidDto' }
    SessionRequest:
      type: object
      required: [title, startAt, registrationDeadline, minParticipants, depositAmount, lotDurationSec, softCloseSec]
      properties:
        title: { type: string }
        description: { type: string }
        startAt: { type: string, format: date-time }
        registrationDeadline: { type: string, format: date-time }
        minParticipants: { type: integer }
        depositAmount: { type: integer, format: int64 }
        lotDurationSec: { type: integer, default: 60 }
        softCloseSec: { type: integer, default: 15 }
    SessionLotsRequest:
      type: object
      required: [lotIds]
      properties: { lotIds: { type: array, items: { type: string } } }

    # ───────── admin config ─────────
    BidIncrementTierDto:
      type: object
      required: [fromPrice, increment]
      properties:
        fromPrice: { type: integer, format: int64 }
        increment: { type: integer, format: int64 }
    SystemConfigDto:
      type: object
      required: [fixedPriceFeePercent, buyerPremiumPercent, sellerCommissionPercent, storageFeePerDay, storageFreeDays, orderPaymentTimeoutMin, auctionPaymentTimeoutHours, depositLimitMultiplier, auctionBanDays, bidIncrementTiers]
      properties:
        fixedPriceFeePercent: { type: number, format: double }
        buyerPremiumPercent: { type: number, format: double }
        sellerCommissionPercent: { type: number, format: double }
        storageFeePerDay: { type: integer, format: int64 }
        storageFreeDays: { type: integer }
        orderPaymentTimeoutMin: { type: integer }
        auctionPaymentTimeoutHours: { type: integer }
        depositLimitMultiplier: { type: integer }
        auctionBanDays: { type: integer }
        returnResponseDays: { type: integer, description: 'order.return_response_days — số ngày shop được trả lời yêu cầu trả hàng (mặc định 2).' }
        bidIncrementTiers: { type: array, items: { $ref: '#/components/schemas/BidIncrementTierDto' } }
    DashboardDto:
      type: object
      required: [revenueTotal, platformFees, orderCount, lotSoldRate, activeUsers, pendingListings, pendingConsignments]
      properties:
        revenueTotal: { type: integer, format: int64 }
        platformFees: { type: integer, format: int64 }
        orderCount: { type: integer }
        lotSoldRate: { type: number, format: double }
        activeUsers: { type: integer }
        pendingListings: { type: integer }
        pendingConsignments: { type: integer }

    # ───────── notifications ─────────
    NotificationDto:
      type: object
      required: [id, type, title, body, isRead, createdAt]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/NotificationType' }
        title: { type: string }
        body: { type: string }
        link: { type: string, description: "Đường dẫn trong app, vd /orders/123, /auctions/sessions/9" }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }
    NotificationPage:
      type: object
      required: [items, page, size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/NotificationDto' } }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }
