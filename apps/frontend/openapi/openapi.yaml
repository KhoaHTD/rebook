# ReBook API contract — viết từ SRS (docs/SRS.txt mục 9 + 10.4).
# Đây là hợp đồng chung giữa frontend Flutter và backend Spring Boot.
# Quy ước:
#  - Tiền là số nguyên VND (integer, int64). Backend dùng BigDecimal/DECIMAL(15,0).
#  - Thời gian là ISO-8601 UTC (date-time). Đồng hồ đấu giá luôn do server quyết định.
#  - Lỗi trả về ErrorResponse; chuyển trạng thái sai trả 409.
#  - Danh sách phân trang trả về *Page { items, page, size, total }, page bắt đầu từ 0.
#  - reserve_price (giá sàn) KHÔNG bao giờ xuất hiện trong API công khai.
openapi: 3.0.3
info:
  title: ReBook API
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Users
  - name: Shops
  - name: Categories
  - name: Listings
  - name: SellerListings
  - name: Cart
  - name: Orders
  - name: SellerOrders
  - name: Wallet
  - name: Payments
  - name: Uploads
  - name: Consignments
  - name: Staff
  - name: Auctions
  - name: Notifications
  - name: Admin

paths:
  # ───────────────────────── Auth ─────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OtpSentResponse' } } } } }
  /auth/verify-otp:
    post:
      tags: [Auth]
      operationId: verifyOtp
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VerifyOtpRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } } }
  /auth/resend-otp:
    post:
      tags: [Auth]
      operationId: resendOtp
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EmailRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OtpSentResponse' } } } } }
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } } }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RefreshRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } } }
  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EmailRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OtpSentResponse' } } } } }
  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResetPasswordRequest' } } } }
      responses: { '204': { description: Đã đổi mật khẩu } }

  # ───────────────────────── Users ─────────────────────────
  /me:
    get:
      tags: [Users]
      operationId: getMe
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserDto' } } } } }
    put:
      tags: [Users]
      operationId: updateMe
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateProfileRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserDto' } } } } }
  /me/addresses:
    get:
      tags: [Users]
      operationId: listAddresses
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AddressDto' } } } } } }
    post:
      tags: [Users]
      operationId: createAddress
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddressRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AddressDto' } } } } }
  /me/addresses/{id}:
    put:
      tags: [Users]
      operationId: updateAddress
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddressRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AddressDto' } } } } }
    delete:
      tags: [Users]
      operationId: deleteAddress
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '204': { description: Đã xóa } }
  /me/devices:
    post:
      tags: [Users]
      operationId: registerDevice
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterDeviceRequest' } } } }
      responses: { '204': { description: Đã lưu FCM token } }

  # ───────────────────────── Shops ─────────────────────────
  /me/shop:
    get:
      tags: [Shops]
      operationId: getMyShop
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ShopDto' } } } } }
    post:
      tags: [Shops]
      operationId: openShop
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ShopRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ShopDto' } } } } }
    put:
      tags: [Shops]
      operationId: updateMyShop
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ShopRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ShopDto' } } } } }
  /me/shop/stats:
    get:
      tags: [Shops]
      operationId: getMyShopStats
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SellerStatsDto' } } } } }
  /shops/{id}:
    get:
      tags: [Shops]
      operationId: getShop
      security: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ShopDto' } } } } }
  /shops/{id}/reviews:
    get:
      tags: [Shops]
      operationId: listShopReviews
      security: []
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewPage' } } } } }

  # ───────────────────────── Categories ─────────────────────────
  /categories:
    get:
      tags: [Categories]
      operationId: listCategories
      security: []
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CategoryDto' } } } } } }

  # ───────────────────────── Listings (public) ─────────────────────────
  /listings:
    get:
      tags: [Listings]
      operationId: searchListings
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: categoryId, in: query, schema: { type: string } }
        - { name: author, in: query, schema: { type: string } }
        - { name: condition, in: query, schema: { $ref: '#/components/schemas/ConditionGrade' } }
        - { name: minPrice, in: query, schema: { type: integer, format: int64 } }
        - { name: maxPrice, in: query, schema: { type: integer, format: int64 } }
        - { name: shopId, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { $ref: '#/components/schemas/ListingSort' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListingPage' } } } } }
  /listings/{id}:
    get:
      tags: [Listings]
      operationId: getListing
      security: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListingDto' } } } } }
  /home/feed:
    get:
      tags: [Listings]
      operationId: getHomeFeed
      security: []
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/HomeFeedDto' } } } } }

  # ───────────────────────── Seller listings ─────────────────────────
  /seller/listings:
    get:
      tags: [SellerListings]
      operationId: listMyListings
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ListingStatus' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListingPage' } } } } }
    post:
      tags: [SellerListings]
      operationId: createListing
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ListingRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListingDto' } } } } }
  /seller/listings/{id}:
    put:
      tags: [SellerListings]
      operationId: updateListing
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ListingRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListingDto' } } } } }
    delete:
      tags: [SellerListings]
      operationId: deleteListing
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '204': { description: Đã xóa } }
  /seller/listings/{id}/visibility:
    post:
      tags: [SellerListings]
      operationId: setListingVisibility
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VisibilityRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListingDto' } } } } }

  # ───────────────────────── Cart ─────────────────────────
  /cart:
    get:
      tags: [Cart]
      operationId: getCart
      parameters: [ { name: addressId, in: query, description: Địa chỉ để tính phí ship, schema: { type: string } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CartDto' } } } } }
    post:
      tags: [Cart]
      operationId: addCartItem
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddCartItemRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CartDto' } } } } }
  /cart/{id}:
    put:
      tags: [Cart]
      operationId: updateCartItem
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QuantityRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CartDto' } } } } }
    delete:
      tags: [Cart]
      operationId: removeCartItem
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CartDto' } } } } }

  # ───────────────────────── Orders (buyer) ─────────────────────────
  /orders/checkout:
    post:
      tags: [Orders]
      operationId: checkout
      description: Tách giỏ thành mỗi shop một đơn, giữ hàng (trừ tồn kho) ngay. Thanh toán online hết hạn sau 15 phút.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CheckoutRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CheckoutResponse' } } } }
        '409': { description: Hết hàng trong lúc đặt, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /orders:
    get:
      tags: [Orders]
      operationId: listMyOrders
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/OrderType' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OrderPage' } } } } }
  /orders/{id}:
    get:
      tags: [Orders]
      operationId: getOrder
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OrderDto' } } } } }
  /orders/{id}/pay:
    post:
      tags: [Orders]
      operationId: payOrder
      description: Thanh toán đơn đang PENDING_PAYMENT (đơn thường hoặc hóa đơn lô thắng) bằng ví hoặc VNPay.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PayOrderRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CheckoutResponse' } } } } }
  /orders/{id}/cancel:
    post:
      tags: [Orders]
      operationId: cancelOrder
      description: Hủy ngay khi PENDING_PAYMENT/PENDING_CONFIRM; sau khi shop xác nhận thì tạo yêu cầu hủy.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OrderDto' } } } } }
  /orders/{id}/confirm-received:
    post:
      tags: [Orders]
      operationId: confirmReceived
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OrderDto' } } } } }
  /orders/{id}/return:
    post:
      tags: [Orders]
      operationId: requestReturn
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReturnRequestInput' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OrderDto' } } } } }
  /orders/{id}/review:
    post:
      tags: [Orders]
      operationId: reviewOrder
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OrderDto' } } } } }

  # ───────────────────────── Seller orders ─────────────────────────
  /seller/orders:
    get:
      tags: [SellerOrders]
      operationId: listShopOrders
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OrderPage' } } } } }
  /seller/orders/{id}/confirm:
    post:
      tags: [SellerOrders]
      operationId: confirmShopOrder
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OrderDto' } } } } }
  /seller/orders/{id}/ship:
    post:
      tags: [SellerOrders]
      operationId: shipShopOrder
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ShipRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OrderDto' } } } } }
  /seller/orders/{id}/delivered:
    post:
      tags: [SellerOrders]
      operationId: markShopOrderDelivered
      description: Giả lập đơn vị vận chuyển báo giao thành công (đồ án).
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OrderDto' } } } } }
  /seller/orders/{id}/cancel:
    post:
      tags: [SellerOrders]
      operationId: cancelShopOrder
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OrderDto' } } } } }
  /seller/orders/{id}/return-decision:
    post:
      tags: [SellerOrders]
      operationId: decideReturn
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReturnDecisionRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OrderDto' } } } } }

  # ───────────────────────── Wallet & payments ─────────────────────────
  /wallet:
    get:
      tags: [Wallet]
      operationId: getWallet
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WalletDto' } } } } }
  /wallet/transactions:
    get:
      tags: [Wallet]
      operationId: listWalletTransactions
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WalletTransactionPage' } } } } }
  /wallet/top-up:
    post:
      tags: [Wallet]
      operationId: topUp
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TopUpRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentDto' } } } } }
  /wallet/withdrawals:
    get:
      tags: [Wallet]
      operationId: listWithdrawals
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/WithdrawalDto' } } } } } }
    post:
      tags: [Wallet]
      operationId: requestWithdrawal
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AmountRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WithdrawalDto' } } } } }
  /payments/{id}:
    get:
      tags: [Payments]
      operationId: getPayment
      description: App gọi lại sau khi người dùng quay về từ VNPay để biết kết quả (IPN đã cập nhật ở backend).
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentDto' } } } } }

  # ───────────────────────── Uploads ─────────────────────────
  /uploads/signature:
    post:
      tags: [Uploads]
      operationId: createUploadSignature
      description: Chữ ký để app upload ảnh thẳng lên Cloudinary; backend chỉ lưu URL.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UploadSignatureRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UploadSignatureDto' } } } } }

  # ───────────────────────── Consignments (seller) ─────────────────────────
  /consignments:
    get:
      tags: [Consignments]
      operationId: listMyConsignments
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ConsignmentDto' } } } } } }
    post:
      tags: [Consignments]
      operationId: createConsignment
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConsignmentRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ConsignmentDto' } } } } }
  /consignments/{id}:
    get:
      tags: [Consignments]
      operationId: getConsignment
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ConsignmentDto' } } } } }
  /consignments/{id}/appointment-slots:
    get:
      tags: [Consignments]
      operationId: listAppointmentSlots
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AppointmentSlotDto' } } } } } }
  /consignments/{id}/appointment:
    post:
      tags: [Consignments]
      operationId: bookAppointment
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AppointmentRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ConsignmentDto' } } } } }
  /consignments/{id}/decision:
    post:
      tags: [Consignments]
      operationId: decideConsignment
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConsignmentDecisionRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ConsignmentDto' } } } } }
  /consignments/{id}/after-auction:
    post:
      tags: [Consignments]
      operationId: chooseAfterUnsold
      description: Lô không bán được — vào phiên sau / chuyển bán giá cố định / nhận lại.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UnsoldChoiceRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ConsignmentDto' } } } } }

  # ───────────────────────── Staff (web quản trị) ─────────────────────────
  /staff/consignments:
    get:
      tags: [Staff]
      operationId: staffListConsignments
      parameters: [ { name: status, in: query, schema: { $ref: '#/components/schemas/ConsignmentStatus' } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ConsignmentDto' } } } } } }
  /staff/consignments/{id}/pre-review:
    post:
      tags: [Staff]
      operationId: staffPreReview
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ConsignmentDto' } } } } }
  /staff/appointments:
    get:
      tags: [Staff]
      operationId: staffListAppointments
      parameters: [ { name: date, in: query, schema: { type: string, format: date } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ConsignmentDto' } } } } } }
  /staff/consignments/check-in:
    post:
      tags: [Staff]
      operationId: staffCheckIn
      description: Quét / nhập mã lịch hẹn, lập biên nhận ký gửi, gán mã kho.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CheckInRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ConsignmentDto' } } } } }
  /staff/consignments/{id}/inspection:
    post:
      tags: [Staff]
      operationId: staffSubmitInspection
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InspectionRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ConsignmentDto' } } } } }
  /staff/warehouse:
    get:
      tags: [Staff]
      operationId: staffListWarehouse
      parameters: [ { name: status, in: query, schema: { $ref: '#/components/schemas/WarehouseStatus' } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/WarehouseItemDto' } } } } } }
  /staff/warehouse/{id}:
    put:
      tags: [Staff]
      operationId: staffUpdateWarehouseItem
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WarehouseUpdateRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WarehouseItemDto' } } } } }
  /staff/orders:
    get:
      tags: [Staff]
      operationId: staffListAuctionOrders
      description: Đơn AUCTION cần kho đóng gói / giao.
      parameters: [ { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OrderDto' } } } } } }
  /staff/orders/{id}/advance:
    post:
      tags: [Staff]
      operationId: staffAdvanceOrder
      description: Kho chuyển đơn đấu giá sang bước kế (PREPARING → SHIPPING → DELIVERED).
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ShipRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OrderDto' } } } } }

  # ───────────────────────── Auctions ─────────────────────────
  /sessions:
    get:
      tags: [Auctions]
      operationId: listSessions
      security: []
      parameters: [ { name: status, in: query, schema: { $ref: '#/components/schemas/SessionStatus' } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AuctionSessionDto' } } } } } }
  /sessions/{id}:
    get:
      tags: [Auctions]
      operationId: getSessionCatalogue
      security: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SessionCatalogueDto' } } } } }
  /sessions/{id}/register:
    post:
      tags: [Auctions]
      operationId: registerSession
      description: Đồng ý quy chế, khóa cọc trong ví (DEPOSIT_HOLD), cấp số bài. Hạn mức = cọc × 10.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterSessionRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RegistrationDto' } } } } }
  /sessions/{id}/registration:
    get:
      tags: [Auctions]
      operationId: getMyRegistration
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RegistrationDto' } } } } }
  /sessions/{id}/state:
    get:
      tags: [Auctions]
      operationId: getSessionState
      description: Ảnh chụp trạng thái phiên — gọi khi vào phòng hoặc reconnect, rồi mới nghe /topic/sessions/{id}.
      security: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SessionStateDto' } } } } }
  /sessions/{id}/results:
    get:
      tags: [Auctions]
      operationId: getSessionResults
      security: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SessionResultDto' } } } } }
  /lots/{id}:
    get:
      tags: [Auctions]
      operationId: getLot
      security: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LotDto' } } } } }
  /lots/{id}/bids:
    get:
      tags: [Auctions]
      operationId: listLotBids
      security: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BidDto' } } } } } }
    post:
      tags: [Auctions]
      operationId: placeBid
      description: Cũng có thể gửi qua STOMP /app/lots/{lotId}/bid. Lỗi 409 "Giá đã thay đổi" nếu người khác trả trước.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PlaceBidRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BidDto' } } } }
        '409': { description: Giá đã thay đổi / lô đã đóng, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /lots/{id}/proxy-bid:
    put:
      tags: [Auctions]
      operationId: setProxyBid
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProxyBidRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProxyBidDto' } } } } }
  /lots/{id}/watch:
    post:
      tags: [Auctions]
      operationId: watchLot
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WatchRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LotDto' } } } } }
  /me/offers:
    get:
      tags: [Auctions]
      operationId: listSecondChanceOffers
      description: Lời mời mua lần hai (SRS 6.6) gửi tới người trả giá cao thứ hai khi người thắng bỏ thanh toán. Chỉ mời khi giá của họ ≥ giá sàn.
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SecondChanceOfferDto' } } } } } }
  /me/offers/{id}/accept:
    post:
      tags: [Auctions]
      operationId: acceptSecondChanceOffer
      description: Nhận mua với giá đã trả; trả về hoá đơn lô (đơn AUCTION).
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OrderDto' } } } } }
  /me/offers/{id}/decline:
    post:
      tags: [Auctions]
      operationId: declineSecondChanceOffer
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SecondChanceOfferDto' } } } } }
  /me/registrations:
    get:
      tags: [Auctions]
      operationId: listMyRegistrations
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RegistrationDto' } } } } } }

  # ───────────────────────── Notifications ─────────────────────────
  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPage' } } } } }
  /notifications/{id}/read:
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '204': { description: OK } }
  /notifications/read-all:
    post:
      tags: [Notifications]
      operationId: markAllNotificationsRead
      responses: { '204': { description: OK } }

  # ───────────────────────── Admin ─────────────────────────
  /admin/listings:
    get:
      tags: [Admin]
      operationId: adminListListings
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ListingStatus' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListingPage' } } } } }
  /admin/listings/{id}/review:
    post:
      tags: [Admin]
      operationId: adminReviewListing
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListingDto' } } } } }
  /admin/users:
    get:
      tags: [Admin]
      operationId: adminListUsers
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserPage' } } } } }
  /admin/users/{id}/lock:
    post:
      tags: [Admin]
      operationId: adminLockUser
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LockUserRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserDto' } } } } }
  /admin/categories:
    post:
      tags: [Admin]
      operationId: adminCreateCategory
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryDto' } } } } }
  /admin/categories/{id}:
    put:
      tags: [Admin]
      operationId: adminUpdateCategory
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryDto' } } } } }
    delete:
      tags: [Admin]
      operationId: adminDeleteCategory
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '204': { description: Đã xóa } }
  /admin/sessions:
    get:
      tags: [Admin]
      operationId: adminListSessions
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AuctionSessionDto' } } } } } }
    post:
      tags: [Admin]
      operationId: adminCreateSession
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SessionRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuctionSessionDto' } } } } }
  /admin/sessions/{id}:
    put:
      tags: [Admin]
      operationId: adminUpdateSession
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SessionRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuctionSessionDto' } } } } }
  /admin/sessions/{id}/lots:
    put:
      tags: [Admin]
      operationId: adminSetSessionLots
      description: Thứ tự trong mảng = số thứ tự lô.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SessionLotsRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SessionCatalogueDto' } } } } }
  /admin/sessions/{id}/publish:
    post:
      tags: [Admin]
      operationId: adminPublishSession
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuctionSessionDto' } } } } }
  /admin/sessions/{id}/pause:
    post:
      tags: [Admin]
      operationId: adminPauseSession
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuctionSessionDto' } } } } }
  /admin/sessions/{id}/resume:
    post:
      tags: [Admin]
      operationId: adminResumeSession
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuctionSessionDto' } } } } }
  /admin/lots:
    get:
      tags: [Admin]
      operationId: adminListLots
      parameters: [ { name: status, in: query, schema: { $ref: '#/components/schemas/LotStatus' } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LotDto' } } } } } }
  /admin/lots/{id}/cancel:
    post:
      tags: [Admin]
      operationId: adminCancelLot
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LotDto' } } } } }
  /admin/configs:
    get:
      tags: [Admin]
      operationId: adminGetConfig
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SystemConfigDto' } } } } }
    put:
      tags: [Admin]
      operationId: adminUpdateConfig
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SystemConfigDto' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SystemConfigDto' } } } } }
  /admin/withdrawals:
    get:
      tags: [Admin]
      operationId: adminListWithdrawals
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/WithdrawalDto' } } } } } }
  /admin/withdrawals/{id}/complete:
    post:
      tags: [Admin]
      operationId: adminCompleteWithdrawal
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WithdrawalReceiptDto' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WithdrawalDto' } } } } }
  /admin/activity-logs:
    get:
      tags: [Admin]
      operationId: adminListActivityLogs
      description: Nhật ký mọi thao tác của Admin (SRS 8.1), mới nhất trước.
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ActivityLogDto' } } } } } }
  /admin/returns:
    get:
      tags: [Admin]
      operationId: adminListDisputes
      description: Yêu cầu trả hàng bị shop từ chối, chờ Admin phân xử.
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OrderDto' } } } } } }
  /admin/returns/{id}/resolve:
    post:
      tags: [Admin]
      operationId: adminResolveDispute
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReturnDecisionRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OrderDto' } } } } }
  /admin/dashboard:
    get:
      tags: [Admin]
      operationId: adminDashboard
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DashboardDto' } } } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
    Page: { name: page, in: query, schema: { type: integer, default: 0 } }
    Size: { name: size, in: query, schema: { type: integer, default: 20 } }

  schemas:
    # ───────── enums ─────────
    UserRole: { type: string, enum: [USER, STAFF, ADMIN] }
    UserStatus: { type: string, enum: [ACTIVE, LOCKED, UNVERIFIED] }
    ConditionGrade:
      type: string
      description: "NEW: chưa đọc; LIKE_NEW: đã đọc, không dấu vết; VERY_GOOD: dùng nhẹ, không ghi chú; GOOD: ghi chú/gấp góc/ố nhẹ; ACCEPTABLE: hư hại rõ, vẫn đọc được"
      enum: [NEW, LIKE_NEW, VERY_GOOD, GOOD, ACCEPTABLE]
    ListingStatus: { type: string, enum: [PENDING_REVIEW, ACTIVE, HIDDEN, OUT_OF_STOCK, REJECTED] }
    ListingSort: { type: string, enum: [NEWEST, PRICE_ASC, PRICE_DESC, RELEVANCE] }
    OrderType: { type: string, enum: [NORMAL, AUCTION] }
    OrderStatus:
      type: string
      enum: [PENDING_PAYMENT, PENDING_CONFIRM, PREPARING, SHIPPING, DELIVERED, RETURN_REQUESTED, COMPLETED, CANCELLED, RETURNED, FAILED_DELIVERY]
    PaymentMethod: { type: string, enum: [COD, WALLET, VNPAY] }
    PaymentStatus: { type: string, enum: [PENDING, SUCCESS, FAILED, EXPIRED] }
    ReturnStatus: { type: string, enum: [PENDING, ACCEPTED, REJECTED, ESCALATED, RESOLVED_REFUND, RESOLVED_NO_REFUND, WITHDRAWN] }
    WalletTransactionType:
      type: string
      enum: [TOP_UP, PAYMENT, REFUND, DEPOSIT_HOLD, DEPOSIT_RELEASE, DEPOSIT_FORFEIT, SALE_PENDING, SALE_RELEASE, FEE, WITHDRAW]
    WithdrawalStatus: { type: string, enum: [PENDING, COMPLETED, REJECTED] }
    ConsignmentStatus:
      type: string
      description: "Vòng đời ký gửi trước khi thành lô: SUBMITTED → PRE_APPROVED (hoặc PRE_REJECTED) → APPOINTMENT_BOOKED (hoặc EXPIRED) → RECEIVED → INSPECTED (hoặc INSPECTION_FAILED → RETURNED) → ACCEPTED (thành lô READY) / WITHDRAWN"
      enum: [SUBMITTED, PRE_APPROVED, PRE_REJECTED, APPOINTMENT_BOOKED, EXPIRED, RECEIVED, INSPECTED, INSPECTION_FAILED, ACCEPTED, WITHDRAWN, RETURNED]
    LotStatus:
      type: string
      description: "READY → SCHEDULED → LIVE → SOLD → COMPLETED; LIVE → UNSOLD → READY/RETURNED; SCHEDULED → READY khi phiên hủy; SOLD → READY khi người thắng bỏ thanh toán"
      enum: [READY, SCHEDULED, LIVE, SOLD, UNSOLD, COMPLETED, RETURNED, CANCELLED]
    LotOutcome: { type: string, enum: [SOLD, BELOW_RESERVE, NO_BIDS, CANCELLED] }
    SessionStatus: { type: string, enum: [DRAFT, PUBLISHED, POSTPONED, CONFIRMED, LIVE, PAUSED, ENDED, CANCELLED] }
    RegistrationStatus: { type: string, enum: [PENDING_DEPOSIT, APPROVED, REFUNDED, APPLIED, FORFEITED] }
    WarehouseStatus: { type: string, enum: [IN_STOCK, RESERVED, SHIPPED, RETURNED] }
    InspectionResult: { type: string, enum: [PASS, FAIL] }
    SignatureStatus: { type: string, enum: [NONE, UNVERIFIED, VERIFIED] }
    SellerDecision: { type: string, enum: [PENDING, ACCEPT, COUNTER, WITHDRAW] }
    UnsoldChoice: { type: string, enum: [NEXT_SESSION, FIXED_PRICE, RETURN] }
    NotificationType: { type: string, enum: [ORDER, AUCTION_REMINDER, OUTBID, AUCTION_WON, AUCTION_RESULT, CONSIGNMENT, WALLET, SYSTEM] }
    ImageSource: { type: string, enum: [SELLER, STAFF] }
    DevicePlatform: { type: string, enum: [ANDROID, IOS, WEB] }

    # ───────── common ─────────
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: "vd PRICE_CHANGED, OUT_OF_STOCK, OWN_LISTING, INVALID_TRANSITION" }
        message: { type: string }
    ReasonRequest: { type: object, required: [reason], properties: { reason: { type: string } } }
    ApprovalRequest:
      type: object
      required: [approve]
      properties: { approve: { type: boolean }, reason: { type: string } }
    AmountRequest: { type: object, required: [amount], properties: { amount: { type: integer, format: int64 } } }
    QuantityRequest: { type: object, required: [quantity], properties: { quantity: { type: integer } } }
    VisibilityRequest: { type: object, required: [visible], properties: { visible: { type: boolean } } }
    EmailRequest: { type: object, required: [email], properties: { email: { type: string } } }

    # ───────── auth & users ─────────
    RegisterRequest:
      type: object
      required: [fullName, email, phone, password]
      properties:
        fullName: { type: string }
