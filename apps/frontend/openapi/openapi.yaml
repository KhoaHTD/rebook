openapi: 3.1.0
info:
  title: ReBook API
  description: "Chợ sách cũ: bán giá cố định + đấu giá. Realtime đấu giá qua WebSocket\
    \ ws://<host>/ws/sessions/{id}"
  version: 0.1.0
servers:
- url: http://localhost:8080
security:
- bearerAuth: []
paths:
  /staff/warehouse/{id}:
    put:
      tags:
      - Consignment
      summary: "[Staff] Cập nhật vị trí kệ"
      operationId: shelf
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShelfRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WarehouseResponse"
  /seller/listings/{id}:
    put:
      tags:
      - Catalog
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListingDetail"
    delete:
      tags:
      - Catalog
      summary: Ẩn tin đăng
      operationId: hide
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListingDetail"
  /seller/listings/{id}/stock:
    put:
      tags:
      - Catalog
      summary: Cập nhật tồn kho
      operationId: updateStock
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListingDetail"
  /me:
    get:
      tags:
      - User
      summary: Hồ sơ của tôi
      operationId: me
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
    put:
      tags:
      - User
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /me/shop:
    get:
      tags:
      - User
      summary: Shop của tôi (kèm thông tin nhận tiền)
      operationId: myShop
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ShopResponse"
    put:
      tags:
      - User
      summary: Bật shop / cập nhật thông tin shop
      operationId: upsertShop
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ShopResponse"
  /me/addresses/{id}:
    put:
      tags:
      - User
      operationId: updateAddress
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AddressResponse"
    delete:
      tags:
      - User
      operationId: deleteAddress
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
  /lots/{id}/proxy-bid:
    put:
      tags:
      - Auction
      summary: Đặt giá tối đa tự động (proxy bid) — đặt trước khi lô mở cũng được
      operationId: proxy
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProxyBidRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: number
    delete:
      tags:
      - Auction
      operationId: cancelProxy
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
  /cart/{listingId}:
    put:
      tags:
      - Order
      operationId: updateCart
      parameters:
      - name: listingId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCartRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CartResponse"
    delete:
      tags:
      - Order
      operationId: removeFromCart
      parameters:
      - name: listingId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CartResponse"
  /admin/users/{id}/role:
    put:
      tags:
      - Admin
      summary: Đổi role (USER / STAFF / ADMIN)
      operationId: role
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /admin/shops/{id}/trusted:
    put:
      tags:
      - Admin
      summary: Đánh dấu shop uy tín (tin đăng được tự duyệt)
      operationId: trusted
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustedRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ShopResponse"
  /admin/sessions/{id}:
    get:
      tags:
      - Auction
      operationId: adminSession
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionDetail"
    put:
      tags:
      - Auction
      operationId: update_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionSummary"
  /admin/sessions/{id}/lots:
    put:
      tags:
      - Auction
      summary: "[Admin] Xếp lô vào phiên theo thứ tự chạy"
      operationId: assignLots
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignLotsRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionDetail"
  /admin/configs/{key}:
    put:
      tags:
      - Admin
      operationId: updateConfig
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SystemConfig"
  /admin/categories/{id}:
    put:
      tags:
      - Catalog
      operationId: updateCategory
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CategoryResponse"
    delete:
      tags:
      - Catalog
      operationId: deleteCategory
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
  /wallet/withdrawals:
    get:
      tags:
      - Wallet
      operationId: myWithdrawals
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WithdrawResponse"
    post:
      tags:
      - Wallet
      summary: Tạo yêu cầu rút tiền (Admin duyệt)
      operationId: withdraw
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawCreateRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WithdrawResponse"
  /wallet/top-up:
    post:
      tags:
      - Wallet
      summary: Nạp tiền qua VNPay sandbox — trả về paymentUrl để mở trình duyệt
      operationId: topUp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopUpRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaymentResponse"
  /staff/warehouse/{id}/return:
    post:
      tags:
      - Consignment
      summary: "[Staff] Xuất kho trả sách cho người bán (thu phí lưu kho nếu quá hạ\
        n)"
      operationId: returnToSeller
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WarehouseResponse"
  /staff/sessions/{id}/resume:
    post:
      tags:
      - Auction
      summary: "[Staff] Tiếp tục phiên"
      operationId: resume
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionSummary"
  /staff/sessions/{id}/pause:
    post:
      tags:
      - Auction
      summary: "[Staff] Tạm dừng phiên"
      operationId: pause
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionSummary"
  /staff/orders/{id}/ship:
    post:
      tags:
      - Order management
      summary: "[Staff] Xuất kho, giao cho shipper"
      operationId: staffShip
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderDetail"
  /staff/orders/{id}/return-decision:
    post:
      tags:
      - Order management
      summary: "[Staff] Xử lý trả hàng lô đấu giá (sàn chịu trách nhiệm)"
      operationId: staffReturnDecision
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderDetail"
  /staff/orders/{id}/delivery-failed:
    post:
      tags:
      - Order management
      operationId: staffFailed
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderDetail"
  /staff/orders/{id}/delivered:
    post:
      tags:
      - Order management
      summary: "[Staff] Giao thành công / bàn giao tại kho"
      operationId: staffDelivered
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderDetail"
  /staff/orders/{id}/confirm:
    post:
      tags:
      - Order management
      operationId: staffConfirm
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderDetail"
  /staff/lots/{id}/cancel:
    post:
      tags:
      - Auction
      summary: "[Staff] Huỷ một lô khi có sự cố"
      operationId: cancelLot
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
  /staff/consignments/{id}/review:
    post:
      tags:
      - Consignment
      summary: "[Staff] Sơ duyệt online"
      operationId: review
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ConsignmentResponse"
  /staff/consignments/{id}/inspection:
    post:
      tags:
      - Consignment
      summary: "[Staff] Phiếu kiểm định + đề xuất giá"
      operationId: inspect
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InspectionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ConsignmentResponse"
  /staff/consignments/{id}/check-in:
    post:
      tags:
      - Consignment
      summary: "[Staff] Nhận sách tại kho, tạo phiếu nhập kho"
      operationId: checkIn
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ConsignmentResponse"
  /sessions/{id}/register:
    post:
      tags:
      - Auction
      summary: "Đăng ký tham gia + đặt cọc (khoá tiền trong ví), nhận số bài"
      operationId: register
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
  /sessions/{id}/deposit:
    post:
      tags:
      - Auction
      summary: Cọc thêm để nâng hạn mức trả giá
      operationId: addDeposit
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddDepositRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
  /seller/orders/{id}/ship:
    post:
      tags:
      - Order management
      summary: "Đã giao cho shipper (nhập mã vận đơn, bỏ trống để tự sinh)"
      operationId: sellerShip
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderDetail"
  /seller/orders/{id}/return-decision:
    post:
      tags:
      - Order management
      summary: Đồng ý / từ chối trả hàng (từ chối → Admin phân xử)
      operationId: sellerReturnDecision
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderDetail"
  /seller/orders/{id}/delivery-failed:
    post:
      tags:
      - Order management
      summary: "[Giả lập] Giao thất bại"
      operationId: sellerFailed
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderDetail"
  /seller/orders/{id}/delivered:
    post:
      tags:
      - Order management
      summary: "[Giả lập] Đã giao thành công"
      operationId: sellerDelivered
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderDetail"
  /seller/orders/{id}/confirm:
    post:
      tags:
      - Order management
      summary: Xác nhận đơn (trong 24h)
      operationId: sellerConfirm
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderDetail"
  /seller/orders/{id}/cancel:
    post:
      tags:
      - Order management
      operationId: sellerCancel
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderDetail"
  /seller/orders/{id}/cancel-request:
    post:
      tags:
      - Order management
      summary: Đồng ý / từ chối yêu cầu huỷ của người mua
      operationId: respondCancel
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderDetail"
  /seller/listings:
    get:
      tags:
      - Catalog
      summary: Tin đăng của shop tôi
      operationId: myListings
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: "#/components/schemas/ListingStatus"
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseListingSummary"
    post:
      tags:
      - Catalog
      summary: Đăng bán sách giá cố định (tối thiểu 3 ảnh)
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListingDetail"
  /seller/listings/{id}/show:
    post:
      tags:
      - Catalog
      summary: Hiện lại tin đã ẩn
      operationId: show
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
