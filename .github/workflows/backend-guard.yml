name: Backend Guard

# LUẬT CỨNG: interface và MỌI nhánh con của nó (nhánh có chứa commit của nó) chỉ chứa frontend.
# Push hay PR nào đụng apps/backend ở các nhánh đó đều bị đánh hỏng. Không có nhãn hay cách bỏ qua.
# Nhánh backend cắt từ main thì không bị ảnh hưởng.
# (Bật branch protection cho interface và đặt "Backend Guard" làm check bắt buộc.
#  Khi interface đã merge hết vào main, xoá workflow này.)
on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  no-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Không có thay đổi apps/backend trên nhánh frontend
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          FRONTEND=interface
          git fetch origin "$FRONTEND" || { echo "Không có origin/$FRONTEND: bỏ qua."; exit 0; }
          ref="origin/$FRONTEND"
          # PR: xét nhánh của tác giả, không xét commit merge tạm của GitHub (nó kéo theo cả main).
          head=${PR_HEAD:-$(git rev-parse HEAD)}
          if [ "$EVENT" = "push" ] && [ "$REF_NAME" = "$FRONTEND" ]; then
            # Push thẳng vào nhánh frontend: xét đúng phần vừa đẩy lên.
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              base=$(git merge-base origin/main "$head")
            else
              base="$BEFORE"
            fi
          elif [ "$EVENT" = "pull_request" ] && [ "$BASE_REF" = "$FRONTEND" ]; then
            # PR vào nhánh frontend: mọi thứ PR thêm vào đều phải sạch backend.
            base=$(git merge-base "$ref" "$head")
          elif git merge-base --is-ancestor "$ref" "$head"; then
            # Nhánh con của nhánh frontend: phần nó thêm so với nhánh frontend phải sạch backend.
            base=$(git merge-base "$ref" "$head")
          else
            echo "Không phải nhánh frontend hay nhánh con: bỏ qua."
            exit 0
          fi
          files=$(git diff --name-only "$base" "$head" -- apps/backend)
          if [ -n "$files" ]; then
            echo "::error::Code backend không được lên interface hay nhánh con của nó:"
            echo "$files"
            exit 1
          fi
          echo "OK: không có thay đổi apps/backend."
