name: Frontend Guard

# Chặn PR đụng vùng khoá (giao diện chủ đạo, kiến trúc, cấu hình, backend, feature của người khác).
# Luật nằm ở apps/frontend/tool/zones.txt; nhãn `core-change` (chỉ chủ repo gắn) cho phép bỏ qua.
# Không lọc theo paths để cũng bắt được PR sửa .github/, .claude/, apps/backend/.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: frontend-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Locked zones check
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: dart run tool/locked_check.dart --base "origin/$BASE_REF" --branch "$HEAD_REF" --labels "$LABELS"
